name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install flake8
      - run: flake8 rag/ kg_pipeline/ langGraphy/ --max-line-length=120 --ignore=E203,W503 || true

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -c "from rag.pipeline import RagPipeline; print('RAG pipeline import OK')"
      - run: python -c "from kg_pipeline.graph import build_graph; print('KG pipeline import OK')"

  build-docker-backend:
    runs-on: ubuntu-latest
    needs: [code-quality, unit-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t rag-backend -f Dockerfile.backend .
